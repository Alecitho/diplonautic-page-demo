{# Iconos SVG en línea (sin dependencias externas). Uso: {{ icon("snow") }} #}
{% macro icon(name, size=24) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "snow" -%}
  <path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/>
{%- elif name == "wind" -%}
  <path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>
{%- elif name == "bolt" -%}
  <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
{%- elif name == "drop" -%}
  <path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>
{%- elif name == "radar" -%}
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/>
{%- elif name == "wrench" -%}
  <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"/>
{%- elif name == "anchor" -%}
  <circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 12H3a9 9 0 0 0 18 0h-2M8 11h8"/>
{%- elif name == "phone" -%}
  <path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>
{%- elif name == "mail" -%}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
{%- elif name == "pin" -%}
  <path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>
{%- elif name == "lock" -%}
  <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
{%- elif name == "user" -%}
  <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "users" -%}
  <circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a7 7 0 0 1 4 6.5"/>
{%- elif name == "chat" -%}
  <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>
{%- elif name == "check" -%}
  <path d="m5 12 5 5 9-10"/>
{%- elif name == "clock" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "pinned" -%}
  <path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v8"/>
{%- elif name == "logout" -%}
  <path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/>
{%- elif name == "shield" -%}
  <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z"/>
{%- elif name == "trash" -%}
  <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
{%- elif name == "plus" -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == "search" -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
{%- endif -%}
</svg>
{%- endmacro %}
